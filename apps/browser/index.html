<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stream browser</title>
  <link rel="stylesheet" href="/apps/styles/proto.css">
  <style>
    header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1.5px dashed var(--rule);
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.1rem; }
    .tagline { color: var(--ink-dim); font-size: 0.85rem; }
    .key-display { font-family: monospace; font-size: 0.7rem; color: var(--ink-dim); margin-left: auto; }

    .workspace {
      display: grid;
      grid-template-columns: 18rem 1fr;
      gap: 1rem;
      height: calc(100vh - 6rem);
    }

    /* file list */
    .file-list {
      overflow-y: auto;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.25rem 0;
    }
    .file-item {
      padding: 0.3rem 0.75rem;
      font-family: monospace;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
    }
    .file-item:hover { background: var(--rule); }
    .file-item.selected { background: var(--accent); color: #fff; }
    .file-item.selected .dim { color: rgba(255,255,255,0.6); }
    .file-path { overflow: hidden; text-overflow: ellipsis; }

    /* editor */
    .editor-panel {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .editor-panel.hidden { display: none; }
    .editor-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .editor-filename { flex: 1; font-family: monospace; font-size: 0.9rem; }
    .editor-textarea {
      flex: 1;
      font-family: monospace;
      font-size: 0.82rem;
      resize: none;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.75rem;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      tab-size: 2;
    }
    .editor-textarea:focus { outline: none; border-color: var(--accent); }

    button {
      font-family: cursive;
      font-size: 0.85rem;
      padding: 0.25rem 0.75rem;
      border: 1.5px solid var(--ink);
      border-radius: var(--radius);
      background: var(--paper);
      cursor: pointer;
      box-shadow: 1px 2px 0 var(--ink);
    }
    button:active { box-shadow: none; transform: translate(1px, 2px); }

    .empty-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>stream browser</h1>
    <span class="tagline">every write is permanent &amp; every connected client sees the same state</span>
    <span id="status" class="pill err">disconnected</span>
    <span id="key-display" class="key-display"></span>
  </header>
  <div id="root"></div>
  <script type="module" src="/apps/browser/main.js"></script>
</body>
</html>
